# 🌸 Cherry — Docker Compose
# Run from /Users/rajatpoddar/Developer/development/mybuffy/cherry
# Usage: docker compose up -d
#
# For NAS deploy (recommended): use host network so backend can reach Ollama
# running on the NAS host (host.docker.internal does NOT work on Synology DSM).
# Both services use host network; ports 3000 + 3003 bind directly to NAS IP.

version: '3.8'

services:
  cherry-backend:
    build: ./backend
    container_name: cherry-backend
    restart: unless-stopped
    network_mode: host
    # CHERRY_LOCAL=1 means: run commands directly on the host (no SSH),
    # because the backend container shares the host's PID/network namespace
    # via network_mode: host AND can see the host's processes/docker via mounts.
    user: "0:0"  # run as root so docker.sock + host /proc are accessible
    volumes:
      - ./data:/app/data          # SQLite memory persists
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      # Mount host docker socket so cherry can run `docker ps`, `docker stats`,
      # etc. against the NAS docker daemon (the same one running herself).
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount host /proc so free/meminfo/nproc reflect the host, not this
      # container. Read-only is fine.
      - /proc:/host-proc:ro
    env_file:
      - .env
    environment:
      - CHERRY_HOST=0.0.0.0
      - CHERRY_PORT=3003
      - CHERRY_LOCAL=1
      - CHERRY_HOST_PROC=/host-proc
      # On NAS, Ollama runs on host. ${OLLAMA_HOST} is set in .env
      - OLLAMA_HOST=${OLLAMA_HOST:-http://localhost:11434}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cherry-frontend:
    build: ./frontend
    container_name: cherry-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      cherry-backend:
        condition: service_healthy
